# ===================================================
# RMS Face AI — Docker Compose (Microservices)
# ===================================================
# Usage:
#   1. Copy .env.docker to .env and edit credentials
#   2. docker-compose up --build -d
#   3. Open http://localhost
# ===================================================

services:

  # ── PostgreSQL Database ─────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: rms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rms_secure_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-rms_db}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rms} -d ${POSTGRES_DB:-rms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rms_internal

  # ── Redis (Celery Broker + Cache) ───────────────────
  redis:
    image: redis:7-alpine
    container_name: rms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rms_internal

  # ── Flask API Service ───────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rms_api:latest
    container_name: rms_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Shared data volume: encodings, uploaded images, ML models
      - rms_data:/app/data
      - ./dataset_cleaned:/app/dataset_cleaned
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL:-postgresql://rms:rms_secure_password_change_me@postgres:5432/rms_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      - SECRET_KEY=${SECRET_KEY:-3d4a379c981564bb5428c615a59436ca13adabc1c7ce0bc48a8ae0d2cba85c5c}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-ee27b0b7df34b222ca98e7711076bd8775235ea7b2ca58a6282a94a74298cbcf}
      - JWT_ACCESS_TOKEN_EXPIRES_MINUTES=${JWT_ACCESS_TOKEN_EXPIRES_MINUTES:-60}
      - JWT_REFRESH_TOKEN_EXPIRES_DAYS=${JWT_REFRESH_TOKEN_EXPIRES_DAYS:-14}
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-cloud}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - CUDA_VISIBLE_DEVICES=-1
      - TF_CPP_MIN_LOG_LEVEL=3
      - OMP_NUM_THREADS=1
      - TF_NUM_INTRAOP_THREADS=1
      - TF_NUM_INTEROP_THREADS=1
      - LAZY_LOAD_MODELS=true
      - MALLOC_ARENA_MAX=2
      - PYTHONUNBUFFERED=1
      - STORAGE_DIR=/app
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rms_internal

  # ── Celery ML Worker ────────────────────────────────
  ml_worker:
    image: rms_api:latest
    container_name: rms_ml_worker
    restart: unless-stopped
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - rms_data:/app/data
      - ./dataset_cleaned:/app/dataset_cleaned
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://rms:rms_secure_password_change_me@postgres:5432/rms_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-cloud}
      - CUDA_VISIBLE_DEVICES=-1
      - TF_CPP_MIN_LOG_LEVEL=3
      - OMP_NUM_THREADS=1
      - TF_NUM_INTRAOP_THREADS=1
      - TF_NUM_INTEROP_THREADS=1
      - MALLOC_ARENA_MAX=2
      - PYTHONUNBUFFERED=1
      - STORAGE_DIR=/app
    depends_on:
      - redis
    networks:
      - rms_internal

  # ── Frontend (React + Nginx) ────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The frontend talks to the API through Nginx proxy, so relative /api
        VITE_API_URL: /api
    container_name: rms_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rms_internal

# ── Persistent Volumes ──────────────────────────────
volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  rms_data:
    driver: local

# ── Networks ────────────────────────────────────────
networks:
  rms_internal:
    driver: bridge
