<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B0F14" />
      <stop offset="100%" stopColor="#040608" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34D399" />
      <stop offset="50%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>

    <!-- Inner Core Radiant Glow -->
    <radialGradient id="apertureGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#34D399" stopOpacity="0.4" />
      <stop offset="60%" stopColor="#10B981" stopOpacity="0.1" />
      <stop offset="100%" stopColor="#10B981" stopOpacity="0" />
    </radialGradient>

    <!-- Shield Border Drop Shadow -->
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" floodColor="#10B981" floodOpacity="0.6" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="1.5" />

  <!-- Background Ambient Glow -->
  <circle cx="64" cy="64" r="38" fill="url(#apertureGlow)" />

  <!-- Camera Viewfinder Biometric Corner Brackets -->
  <path d="M28 42V32C28 29.7909 29.7909 28 32 28H42" stroke="#34D399" stroke-width="3" stroke-linecap="round" />
  <path d="M100 42V32C100 29.7909 98.2091 28 96 28H86" stroke="#34D399" stroke-width="3" stroke-linecap="round" />
  <path d="M28 86V96C28 98.2091 29.7909 100 32 100H42" stroke="#34D399" stroke-width="3" stroke-linecap="round" />
  <path d="M100 86V96C100 98.2091 98.2091 100 96 100H86" stroke="#34D399" stroke-width="3" stroke-linecap="round" />

  <!-- Outer Sovereign Security Shield Outline -->
  <path 
    d="M64 32C76 32 90 35 90 48C90 70 68 87 64 92C60 87 38 70 38 48C38 35 52 32 64 32Z" 
    stroke="url(#emeraldShield)" 
    stroke-width="3.5" 
    stroke-linejoin="round"
    filter="url(#shieldGlow)"
    fill="#0E141B" 
    fill-opacity="0.85" 
  />

  <!-- Concentric Biometric Wave Rings -->
  <circle cx="64" cy="58" r="16" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.75" />
  <circle cx="64" cy="58" r="9" stroke="#34D399" stroke-width="2" fill="#0A0F14" />

  <!-- Optical Neural Iris Center Node -->
  <circle cx="64" cy="58" r="4.5" fill="#FAFAFA" />

  <!-- Dynamic Verification Pulse Notch -->
  <path d="M60 58H68" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" />
  <path d="M64 54V62" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" />
</svg>
