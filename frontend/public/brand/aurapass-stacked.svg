<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="apStackGrad" x1="56" y1="12" x2="104" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00E5FF" />
      <stop offset="48%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
  </defs>

  <!-- Centered Symbol (Scale 1.25 -> 60px) -->
  <g transform="translate(50, 16) scale(1.25)">
    <!-- Arch -->
    <path
      d="M24 3L6 11V23C6 34.2 13.8 44.5 24 47C34.2 44.5 42 34.2 42 23V11L24 3Z"
      stroke="url(#apStackGrad)"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Chevron -->
    <path
      d="M14 26L24 16L34 26"
      stroke="#00E5FF"
      stroke-width="2.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Biometric Arc -->
    <path
      d="M17 31C18.8 33.2 21.3 34.5 24 34.5C26.7 34.5 29.2 33.2 31 31"
      stroke="#34D399"
      stroke-width="2.2"
      stroke-linecap="round"
    />

    <!-- Core -->
    <circle cx="24" cy="24" r="4" fill="#FAFAFA" />
    <circle cx="24" cy="24" r="2" fill="#10B981" />

    <!-- Ticks -->
    <path d="M24 9V12" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
    <path d="M24 36V39" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
    <path d="M11 23H14" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
    <path d="M34 23H37" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Wordmark Centered -->
  <text
    x="80"
    y="112"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="22"
    font-weight="800"
    letter-spacing="-0.03em"
    fill="#FAFAFA"
  >
    AuraPass
  </text>

  <!-- Descriptor Subtitle -->
  <text
    x="80"
    y="130"
    text-anchor="middle"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="8"
    font-weight="600"
    letter-spacing="0.22em"
    fill="#10B981"
  >
    ENTERPRISE
  </text>
</svg>

