<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Radiant Emerald to Teal Laser Gradient -->
    <linearGradient id="auraGlowGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#34D399" />
      <stop offset="50%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>

    <!-- Subtle Drop Glow -->
    <filter id="auraEmblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" floodColor="#10B981" floodOpacity="0.6" />
    </filter>
  </defs>

  <!-- 
    AuraPass™ Geometric Monogram:
    - Bold Outer Sovereign Gateway / Biometric Shield Arch (The "A" & Entrance Gate)
    - Radiant Central Optical Lens & Vector Node (Sub-second Facial Verification)
    - Clean, standalone vector curves with zero enclosing box
  -->

  <!-- Outer Sovereign Gateway Arch -->
  <path
    d="M24 4L7 11V23.5C7 33.8 14.3 43.2 24 46C33.7 43.2 41 33.8 41 23.5V11L24 4Z"
    stroke="url(#auraGlowGrad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#auraEmblemGlow)"
  />

  <!-- Inner Dynamic Biometric Aura Arc (The "A" Cross-Bar / Optical Iris Ring) -->
  <path
    d="M15 25C15 20.0294 19.0294 16 24 16C28.9706 16 33 20.0294 33 25"
    stroke="#34D399"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Central Optical Core Node (Real Living Person Verification) -->
  <circle cx="24" cy="27" r="4.5" fill="#FAFAFA" />
  <circle cx="24" cy="27" r="2" fill="#10B981" />

  <!-- Speed Scan Pulse Rays -->
  <path d="M24 10V13" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
  <path d="M12 28L14 27" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
  <path d="M36 28L34 27" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
</svg>
