services:
  - type: web
    name: rms-face-ai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && gunicorn -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker server:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1
    envVars:
      - key: LAZY_LOAD_MODELS
        value: "true"
      - key: FRONTEND_URL
        value: https://your-app.vercel.app # Override in Render dashboard with actual Vercel URL
