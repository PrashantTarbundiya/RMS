server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt ACME verification
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Redirect all HTTP requests to trusted SSL domain for mobile camera access
    location / {
        return 301 https://13-60-225-165.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # If accessed directly via raw IP over HTTPS, redirect to the certified domain
    if ($host != "13-60-225-165.sslip.io") {
        return 301 https://13-60-225-165.sslip.io$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip Compression ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # ── Docker Embedded DNS Resolver ──
    # Uses Docker's internal DNS (127.0.0.11) to re-resolve upstream IPs dynamically
    # Prevents 502 Bad Gateway when the backend container restarts or changes IP
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_api api:8000;

    # ── API Proxy ──
    # Forward /api requests to the Flask backend container
    location /api/ {
        proxy_pass http://$upstream_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for long-running ML operations
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;

        # Allow large file uploads (face images, datasets)
        client_max_body_size 50M;
    }

    # ── WebSocket Proxy (Flask-SocketIO) ──
    location /socket.io/ {
        proxy_pass http://$upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── SPA Fallback ──
    # For React Router — any route that doesn't match a file falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── PWA Service Worker & Manifest (Never cache — instant updates) ──
    location ~* (sw\.js|manifest\.webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        access_log off;
    }

    # ── Static Asset Caching ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
